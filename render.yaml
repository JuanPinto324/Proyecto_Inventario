services:
  - type: web
    name: pycommercex
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn run:app

    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10

      - key: SECRET_KEY
        generateValue: true

      - key: DATABASE_URL
        fromDatabase:
          name: pycommercex-db
          property: connectionString

databases:
  - name: pycommercex-db
    plan: free